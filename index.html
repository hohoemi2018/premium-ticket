<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ほほえみプレミアム30枚チケット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: スタンプカード型のチケット（残数の要約）→ 一覧（日時・相談内容・状態・使用・残り）→ 詳細はシート（スマホは下から、PCは中央）で開く */
:root{
  --bg:#FDF5F4;          /* うすい桜色の地 */
  --surface:#FFFFFF;
  --surface-2:#FAEDEE;
  --line:#EBD7DA;
  --ink:#3B3140;         /* 本文：すみれがかった墨色 */
  --ink-2:#6C6070;
  --accent:#C24A69;      /* ほほえみローズ */
  --accent-ink:#FFFFFF;
  --accent-soft:#FBE1E8;
  --accent-deep:#9C3350;
  --leaf:#2F7D5C; --leaf-ink:#FFFFFF; --leaf-soft:#DFF1E8;
  --sky:#2C67A6;  --sky-soft:#E2EDF9;
  --honey:#8A5600; --honey-soft:#FFF0CF;
  --stone:#6A6370; --stone-soft:#EEEAF0;
  --danger:#B0353C; --danger-soft:#FBE3E3;
  --focus:#2C67A6;
  --shadow:0 8px 24px rgba(140,60,85,.10);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --font-num:"Fredoka","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --r-lg:22px; --r-md:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E191F; --surface:#2A232B; --surface-2:#342A35; --line:#4A3D4C;
  --ink:#F4EBF1; --ink-2:#C2B4C4;
  --accent:#F18BA5; --accent-ink:#2A111B; --accent-soft:#4B2534; --accent-deep:#FFB3C6;
  --leaf:#7FD3AC; --leaf-ink:#0F2A1F; --leaf-soft:#1D3A2E;
  --sky:#93C3F5; --sky-soft:#1C3049;
  --honey:#F3C66E; --honey-soft:#3B2E16;
  --stone:#CAC1CD; --stone-soft:#393239;
  --danger:#FF9EA3; --danger-soft:#4A2226;
  --focus:#93C3F5; --shadow:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1E191F; --surface:#2A232B; --surface-2:#342A35; --line:#4A3D4C;
  --ink:#F4EBF1; --ink-2:#C2B4C4;
  --accent:#F18BA5; --accent-ink:#2A111B; --accent-soft:#4B2534; --accent-deep:#FFB3C6;
  --leaf:#7FD3AC; --leaf-ink:#0F2A1F; --leaf-soft:#1D3A2E;
  --sky:#93C3F5; --sky-soft:#1C3049;
  --honey:#F3C66E; --honey-soft:#3B2E16;
  --stone:#CAC1CD; --stone-soft:#393239;
  --danger:#FF9EA3; --danger-soft:#4A2226;
  --focus:#93C3F5; --shadow:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{line-height:1.4;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- ヘッダー ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none}
.logo .face{fill:var(--accent)} .logo .eye{fill:var(--accent-ink)} .logo .mouth{stroke:var(--accent-ink)}
.brand-name{font-weight:700;font-size:1.05rem;line-height:1.3}
.brand-sub{font-size:.8rem;color:var(--ink-2);line-height:1.3}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem}
.who-name{font-weight:700}
.role{display:inline-block;font-size:.75rem;font-weight:700;padding:.1em .7em;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.role.admin{background:var(--sky-soft);color:var(--sky)}
.who select{min-height:40px;padding:.3em .6em;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);max-width:220px}

.main{display:flex;flex-direction:column;gap:20px;padding-block:20px 48px}

.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--honey-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 16px;font-size:.92rem}
.demo b{color:var(--honey)}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;padding:.5em 1.2em;border-radius:999px;border:1.5px solid transparent;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.3;transition:transform .12s ease, background-color .12s ease}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-deep);color:var(--surface)}
.btn.soft{background:var(--accent-soft);color:var(--accent-deep)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.leaf{background:var(--leaf);color:var(--leaf-ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{min-height:36px;padding:.3em .9em;font-size:.9rem}
.btn.link{background:none;border:none;color:var(--accent-deep);padding:.2em .2em;min-height:auto;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;line-height:1;color:var(--ink-2)}

/* ---------- チケット（スタンプカード） ---------- */
.ticket{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px;border:1.5px dashed var(--line)}
.ticket-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
.remain{display:flex;align-items:baseline;gap:.25em;line-height:1}
.remain .num{font-size:3.6rem;font-weight:600;color:var(--accent)}
.remain .unit{font-size:1.2rem;font-weight:700}
.remain .of{font-size:1rem;color:var(--ink-2);margin-left:.4em}
.tstats{display:flex;gap:18px;margin:0}
.tstats div{display:flex;flex-direction:column;align-items:center;min-width:3.2rem}
.tstats dt{font-size:.78rem;color:var(--ink-2)}
.tstats dd{margin:0;font-family:var(--font-num);font-size:1.4rem;font-weight:600;line-height:1.2}
.stamps{display:grid;grid-template-columns:repeat(10,minmax(0,38px));gap:7px;justify-content:start}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--font-num);font-size:.72rem;color:var(--ink-2);border:1.5px dashed var(--line);background:var(--bg)}
.stamp.used{border:none;background:var(--accent-soft)}
.stamp svg{width:78%;height:78%}
.stamp .face{fill:var(--accent)} .stamp .eye{fill:var(--accent-ink)} .stamp .mouth{stroke:var(--accent-ink)}
.ticket-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ticket-foot p{font-size:.88rem;color:var(--ink-2);max-width:34em}

.next{background:var(--sky-soft);border-radius:var(--r-lg);padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.next .when{font-size:1.25rem;font-weight:700}
.next .msg{font-size:.9rem;color:var(--ink-2);margin-top:2px}

/* ---------- 管理者サマリー ---------- */
.summary{display:flex;gap:10px;flex-wrap:wrap}
.chip-stat{display:flex;align-items:center;gap:.6em;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.45em 1.1em;cursor:pointer;font-size:.92rem;min-height:44px}
.chip-stat:hover{border-color:var(--accent)}
.chip-stat b{font-family:var(--font-num);font-size:1.25rem;line-height:1}
.chip-stat.alert{background:var(--honey-soft);border-color:transparent}
.chip-stat.alert b{color:var(--honey)}
.chip-stat.plain{cursor:default}
.chip-stat.plain:hover{border-color:var(--line)}

/* ---------- タブ ---------- */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{border:none;background:none;border-radius:999px;padding:.45em 1.1em;min-height:40px;cursor:pointer;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(140,60,85,.12)}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.2rem}

/* ---------- 絞り込み ---------- */
.filters{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:var(--r-md);padding:12px;border:1px solid var(--line)}
.f-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;padding-left:2.3em}
.search svg{position:absolute;left:.75em;top:50%;transform:translateY(-50%);width:1.1em;height:1.1em;stroke:var(--ink-2)}
input[type=text],input[type=email],input[type=search],input[type=date],input[type=number],select,textarea{min-height:44px;padding:.5em .8em;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;max-width:100%}
textarea{width:100%;min-height:6.5em;resize:vertical;line-height:1.7}
.filters .search input{padding-left:2.5em}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.25em .9em;min-height:38px;cursor:pointer;font-size:.92rem;display:inline-flex;gap:.4em;align-items:center}
.fchip .c{font-family:var(--font-num);color:var(--ink-2);font-size:.85rem}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] .c{color:var(--bg)}

/* ---------- 状態 ---------- */
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.12em .75em;border-radius:999px;font-size:.85rem;font-weight:700;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:.6em;height:.6em;border-radius:50%;flex:none}
.st-requested{background:var(--honey-soft);color:var(--honey)}
.st-requested::before{border:2px solid currentColor}
.st-confirmed{background:var(--sky-soft);color:var(--sky)}
.st-confirmed::before{background:currentColor}
.st-completed{background:var(--leaf-soft);color:var(--leaf)}
.st-completed::before{content:"✓";width:auto;height:auto;font-size:.95em;line-height:1}
.st-cancelled{background:var(--stone-soft);color:var(--stone)}
.st-cancelled::before{content:"－";width:auto;height:auto;line-height:1}

/* ---------- 一覧 ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.list-head,.row{display:grid;grid-template-columns:11.5rem minmax(0,1fr) 6.8rem 4.2rem 5.6rem;gap:12px;align-items:center}
.is-admin .list-head,.is-admin .row{grid-template-columns:11.5rem 7.5rem minmax(0,1fr) 6.8rem 4.2rem 5.6rem}
.list-head{font-size:.8rem;color:var(--ink-2);font-weight:700;padding:0 16px}
.row{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 16px;cursor:pointer;transition:border-color .12s ease, box-shadow .12s ease}
.row:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.row.is-cancelled .c-title,.row.is-cancelled .c-when{color:var(--ink-2)}
.c-when{display:flex;flex-direction:column;line-height:1.35}
.c-when .w{font-weight:700;font-family:var(--font-num)}
.c-when .s{font-size:.8rem;color:var(--ink-2)}
.c-who{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.c-tix{display:contents}
.c-used,.c-left{font-family:var(--font-num);text-align:right;white-space:nowrap}
.c-used b,.c-left b{font-weight:600}
.c-left .now{color:var(--ink-2);font-size:.85rem}
.c-left .snap{display:block;font-size:.72rem;color:var(--ink-2);font-family:var(--font);line-height:1.2}
.lbl{display:none}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r-md);padding:28px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}

@media (max-width:760px){
  .list-head{display:none}
  .row,.is-admin .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when status" "title title" "tix tix";gap:6px 10px}
  .is-admin .row{grid-template-areas:"when status" "title title" "who tix"}
  .c-when{grid-area:when;flex-direction:row;align-items:baseline;gap:.5em;flex-wrap:wrap}
  .c-status{grid-area:status}
  .c-title{grid-area:title;white-space:normal;font-size:1.02rem}
  .c-who{grid-area:who;color:var(--ink-2)}
  .c-tix{grid-area:tix;display:flex;gap:14px;justify-content:flex-end;font-size:.9rem}
  .c-used,.c-left{text-align:left}
  .c-left .snap{display:inline;margin-left:.3em}
  .lbl{display:inline;font-family:var(--font);color:var(--ink-2);font-size:.8rem;margin-right:.3em}
  .remain .num{font-size:3rem}
  .tstats{gap:12px}
}

/* ---------- 台帳・履歴 ---------- */
.ledger{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);overflow:hidden}
.lg-row{display:grid;grid-template-columns:9.5rem minmax(0,1fr) 4.5rem 4.5rem;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.lg-row:first-child{border-top:none}
.lg-row.head{font-size:.8rem;color:var(--ink-2);font-weight:700;background:var(--surface-2)}
.lg-when{font-family:var(--font-num);font-size:.9rem}
.lg-what{min-width:0}
.lg-what .t{font-weight:500}
.lg-what .r{font-size:.82rem;color:var(--ink-2);overflow-wrap:anywhere}
.lg-delta,.lg-bal{font-family:var(--font-num);text-align:right;font-weight:600}
.minus{color:var(--accent-deep)} .plus{color:var(--leaf)}
@media (max-width:760px){
  .lg-row{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"when delta bal" "what what what";gap:2px 14px}
  .lg-row.head{display:none}
  .lg-when{grid-area:when;color:var(--ink-2)} .lg-what{grid-area:what} .lg-delta{grid-area:delta} .lg-bal{grid-area:bal}
}

.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.stu{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.stu:hover{border-color:var(--accent)}
.stu-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stu-name{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.stu-rem{font-family:var(--font-num);font-size:1.6rem;font-weight:600;color:var(--accent);line-height:1}
.stu-rem small{font-family:var(--font);font-size:.8rem;color:var(--ink-2);margin-left:.2em}
.stu-meta{font-size:.85rem;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}

.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ev{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.ev:first-child{border-top:none}
.ev time{font-family:var(--font-num);font-size:.9rem;color:var(--ink-2)}
.ev-body{min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.ev-who{font-size:.85rem;color:var(--ink-2)}
.ev-what{font-weight:500}
.ev-reason{font-size:.88rem;background:var(--surface-2);border-radius:10px;padding:2px 10px;width:fit-content;max-width:100%}
.ev-link{font-size:.85rem}
@media (max-width:760px){ .ev{grid-template-columns:1fr;gap:2px} }

/* ---------- シート ---------- */
.backdrop{position:fixed;inset:0;background:rgba(40,20,35,.38);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 32px));max-height:min(88vh,900px);overflow:auto;background:var(--bg);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;border:none;background:var(--surface-2);cursor:pointer;font-size:1.2rem;color:var(--ink-2)}
@media (max-width:640px){
  .sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:92vh;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}
.sh-head{display:flex;flex-direction:column;gap:6px;padding-right:44px}
.sh-head h2{font-size:1.35rem}
.sh-head h2:focus{outline:none}
.sh-when{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.sh-when .big{font-size:1.3rem;font-weight:700}
.sh-when ol{margin:0;padding-left:1.4em}
.sh-when .method b{font-weight:700}
.sh-when .note{font-size:.9rem;color:var(--ink-2)}
.fields{margin:0;display:flex;flex-direction:column;gap:12px}
.fields dt{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.fields dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border-radius:var(--r-md);padding:10px 14px}
.fields dd.empty-v{color:var(--ink-2);background:transparent;padding:0}
.sh-ticket{border-radius:var(--r-md);padding:12px 16px;font-size:.95rem;background:var(--surface-2)}
.sh-ticket.used{background:var(--accent-soft)}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap}
.sh-note{font-size:.88rem;color:var(--ink-2)}
.sh-sec{display:flex;flex-direction:column;gap:8px}
.sh-sec h3{font-size:1rem}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-25px;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.timeline time{font-family:var(--font-num);font-size:.85rem;color:var(--ink-2)}
.diff{margin:4px 0 0;padding:0;list-style:none;font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.diff details{margin-top:2px}
.diff summary{cursor:pointer;color:var(--accent-deep)}
.diff pre{white-space:pre-wrap;font-family:var(--font);background:var(--surface);border-radius:10px;padding:6px 10px;margin:4px 0}

/* ---------- フォーム ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.back{align-self:flex-start}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab,legend{font-weight:700;font-size:.95rem}
.req{font-size:.72rem;font-weight:700;background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;padding:.05em .6em;margin-left:.4em;vertical-align:.1em}
.hint{font-size:.85rem;color:var(--ink-2)}
.count{font-size:.8rem;color:var(--ink-2);text-align:right;font-family:var(--font-num)}
fieldset{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-list{display:flex;flex-direction:column;gap:8px}
.slot-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot-label{font-size:.85rem;font-weight:700;color:var(--ink-2);width:4.2em}
.slot-row input[type=date]{flex:1 1 9.5em;min-width:0}
.slot-row select{flex:0 0 6.5em}
.radio-list{display:flex;flex-direction:column;gap:6px}
.radio{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;flex-wrap:wrap}
.radio input{width:20px;height:20px;accent-color:var(--accent)}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.inline-dt{display:flex;gap:8px;flex-wrap:wrap}
.inline-dt input[type=date]{flex:1 1 9.5em;min-width:0}
.callout{border-radius:var(--r-md);padding:12px 16px;font-size:.95rem;background:var(--surface);border:1.5px solid var(--line)}
.callout.warn{background:var(--honey-soft);border-color:transparent}
.callout.ok{background:var(--leaf-soft);border-color:transparent}
.callout b.num{font-size:1.15em}
.form-error{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 14px;font-weight:500}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.bal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bal-grid div{background:var(--surface);border-radius:var(--r-md);padding:10px;text-align:center;display:flex;flex-direction:column}
.bal-grid span{font-size:.8rem;color:var(--ink-2)}
.bal-grid b{font-family:var(--font-num);font-size:1.5rem;font-weight:600;line-height:1.2}
.bal-grid div:first-child b{color:var(--accent)}

/* ---------- ログイン・その他 ---------- */
.center-card{max-width:440px;margin:48px auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.center-card h1{font-size:1.3rem}
.link-box{background:var(--surface);border:1.5px dashed var(--accent);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.link-box h3{font-size:1rem}
.link-url{width:100%;font-family:var(--font-num);font-size:.9rem;color:var(--ink-2);background:var(--surface-2)}
.link-box textarea{font-size:.9rem;margin-top:6px}
.link-box summary{cursor:pointer;color:var(--accent-deep);font-weight:500}
.foot{font-size:.82rem;color:var(--ink-2);padding-block:0 32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 18px;max-width:calc(100vw - 32px);width:max-content;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div id="app"><div class="center-card"><p>読み込み中…</p></div></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* =====================================================================
   ほほえみプレミアム30枚チケット／個別コンサル予約管理
   ---------------------------------------------------------------------
   ■ 動作モード
   ・本番（CONFIG に Supabase の URL とキーを入れたとき）
       - 受講生：専用リンク（末尾が #k=… のURL）で開くと、その方の画面になります。ログイン不要。
       - 管理者：専用リンクなしで開くと管理者ログイン。登録された管理者だけが管理画面を使えます。
       事前に supabase/schema.sql の実行が必要です（README.md 参照）。
   ・デモ（Supabase 未設定で DEMO: true のとき）：見本データで、このブラウザの中だけで動きます。
   ・準備中（Supabase 未設定で DEMO: false のとき）：「準備中」と表示するだけです。
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://ejihlwhvjggkkgggrdvw.supabase.co",   // 例： "https://abcdefghijk.supabase.co"
  SUPABASE_KEY: "sb_publishable_ZI-qAw_sp1DwZd8DoF0KQw_muIbL-AZ",   // 公開用のキー：Publishable key（sb_publishable_…）または anon public キー。secret / service_role キーは絶対に入れない
  DEMO: false,        // 公開用：未接続のときは「準備中」と表示する
};
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js";
const STUDENT_FNS = ["request_booking", "edit_booking", "request_change", "cancel_booking"];
function readKeyFromHash() {
  const m = /(?:^#|&)k=([0-9a-f]{32})(?:&|$)/i.exec(location.hash || "");
  return m ? m[1].toLowerCase() : null;
}
const hasHashKey = () => /(?:^#|&)k=/.test(location.hash || "");
const linkFor = (key) => `${location.origin}${location.pathname}#k=${key}`;

/* ---------- 小さな道具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clone = (o) => JSON.parse(JSON.stringify(o));
const len = (s) => [...String(s ?? "")].length;
const signed = (n) => (n > 0 ? "+" + n : String(n));
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); });
}

/* ---------- 日本時間（JST・夏時間なし）---------- */
const WD = ["日", "月", "火", "水", "木", "金", "土"];
function jst(iso) { const d = new Date(Date.parse(iso) + 9 * 3600e3); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), hh: d.getUTCHours(), mm: d.getUTCMinutes(), wd: d.getUTCDay() }; }
const nowISO = () => new Date().toISOString();
function fmtWhen(iso) { if (!iso) return "—"; const p = jst(iso), n = jst(nowISO()); return `${p.y !== n.y ? p.y + "年" : ""}${p.m}月${p.d}日（${WD[p.wd]}）${p.hh}:${pad(p.mm)}`; }
function fmtShort(iso) { if (!iso) return "—"; const p = jst(iso), n = jst(nowISO()); return `${p.y !== n.y ? p.y + "/" : ""}${p.m}/${p.d}（${WD[p.wd]}）${p.hh}:${pad(p.mm)}`; }
function fmtStamp(iso) { if (!iso) return "—"; const p = jst(iso); return `${p.y}/${pad(p.m)}/${pad(p.d)} ${pad(p.hh)}:${pad(p.mm)}`; }
function fmtDay(iso) { const p = jst(iso); return `${p.m}/${p.d}`; }
const jstToISO = (date, time) => new Date(`${date}T${time}:00+09:00`).toISOString();
function isoToJstDate(iso) { const p = jst(iso); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; }
function isoToJstTime(iso) { const p = jst(iso); return `${pad(p.hh)}:${pad(p.mm)}`; }
const todayJst = () => isoToJstDate(nowISO());
function dayISO(days, hm) { const p = jst(nowISO()); const d = new Date(Date.UTC(p.y, p.m - 1, p.d + days)); return jstToISO(`${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`, hm); }
function startOfTodayMs() { return Date.parse(jstToISO(todayJst(), "00:00")); }

const STATUS = {
  requested: { label: "申込中" },
  confirmed: { label: "確定" },
  completed: { label: "完了" },
  cancelled: { label: "キャンセル" },
};
const pill = (s) => `<span class="pill st-${s}">${STATUS[s]?.label ?? esc(s)}</span>`;
const FIELD = { title: "相談内容（ひとことで）", want_together: "一緒にしてほしいこと", want_learn: "教えてほしいこと", preferred_slots: "希望日時", duration_min: "時間", meeting_method: "実施方法", admin_message: "連絡事項", display_name: "お名前", email: "メールアドレス", active: "利用状態" };
/* コンサルの実施方法（Lark）。受講生とのやり取りはLarkのチャットで行う */
const METHOD = {
  lark_meeting: { label: "Larkビデオ会議", short: "ビデオ会議", note: "参加リンクは、Larkのチャットでお送りします。" },
  lark_call: { label: "Larkビデオ通話", short: "ビデオ通話", note: "予約の時間に、Larkのチャットからビデオ通話をおかけします。" },
};
const methodLabel = (m) => METHOD[m]?.label || METHOD.lark_meeting.label;
const methodShort = (m) => METHOD[m]?.short || METHOD.lark_meeting.short;
const methodNote = (m) => METHOD[m]?.note || METHOD.lark_meeting.note;
const LONG_FIELDS = ["want_together", "want_learn", "admin_message"];
const KIND = { issue: "チケット発行", consume: "コンサル完了で使用", restore: "完了の取り消しで戻す", adjust: "枚数の調整" };
const ACTIONS = { request: "申込み", edit: "内容の編集", confirm: "確定", reschedule: "日時の変更", change_request: "日時の変更依頼", complete: "完了（1枚使用）", undo_complete: "完了の取り消し", cancel: "キャンセル", undo_cancel: "キャンセルの取り消し", issue: "チケット発行", adjust: "枚数の調整", profile: "受講生情報の変更", create_student: "受講生の登録", reissue_key: "専用リンクの再発行" };

/* =====================================================================
   デモ用サーバー（このブラウザ内）— supabase/schema.sql の関数と同じ規則で動きます
   ===================================================================== */
const RPCS = ["request_booking", "edit_booking", "confirm_booking", "reschedule_booking", "request_change", "complete_booking", "undo_completion", "cancel_booking", "undo_cancellation", "issue_tickets", "adjust_tickets", "update_profile", "admin_create_student", "admin_get_key", "admin_reissue_key"];
const demoKey = () => uuid().replace(/-/g, "");

class DemoServer {
  constructor() {
    this.KEY = "hohoemi-premium-ticket-demo-v3";
    this.clock = null;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(this.KEY) || "null"); } catch (e) { saved = null; }
    this.db = saved && saved.ver === 3 ? saved : this.seed();
    this.save();
  }
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.db)); } catch (e) { /* 保存できない環境でも動作は続ける */ } }
  reset() { this.db = this.seed(); this.save(); }
  now() { return this.clock || nowISO(); }
  fail(m) { throw new Error(m); }
  get me() { return this.db.profiles.find((p) => p.id === this.db.meId) || null; }
  setMe(id) { this.db.meId = id; this.save(); }
  uid() { const m = this.me; if (!m) this.fail("ログインが必要です"); return m.id; }
  isAdmin() { const m = this.me; return !!(m && m.role === "admin" && m.active); }
  prof(id) { return this.db.profiles.find((p) => p.id === id) || null; }
  bk(id) { const b = this.db.bookings.find((x) => x.id === id); if (!b) this.fail("予約が見つかりません"); return b; }
  balance(sid) { let s = 0; for (const l of this.db.ledger) if (l.student_id === sid) s += l.delta; return s; }
  hasReq(rid) { return !!rid && this.db.ledger.some((l) => l.request_id === rid); }
  log(actor, sid, bid, action, detail, reason) {
    this.db.events.push({ id: ++this.db.seq.event, at: this.now(), actor_id: actor, actor_role: this.prof(actor)?.role || "unknown", student_id: sid || null, booking_id: bid || null, action, detail: detail || {}, reason: String(reason || "").trim() });
  }
  addLedger(row) {
    if (row.request_id && this.hasReq(row.request_id)) this.fail("この操作はすでに記録されています");
    this.db.ledger.push({ booking_id: null, reason: "", request_id: null, ...row, id: ++this.db.seq.ledger, created_at: this.now() });
    return this.db.seq.ledger;
  }
  needReason(r) { r = String(r ?? "").trim(); if (len(r) < 2) this.fail("理由を入力してください（訂正・変更の記録に残ります）"); return r; }
  ver(b, v) { if (b.version !== Number(v)) this.fail("他の操作で内容が更新されています。画面を更新してから、もう一度お試しください"); }
  touch(b) { b.version++; b.updated_at = this.now(); }
  slots(arr) {
    if (!Array.isArray(arr)) return null;
    return arr.map((x) => { const t = Date.parse(x); if (isNaN(t)) this.fail("日時の形式が正しくありません"); return new Date(t).toISOString(); });
  }
  same(a, b) { return a.length === b.length && a.every((x, i) => Date.parse(x) === Date.parse(b[i])); }
  past(slots) { return slots.some((s) => Date.parse(s) < Date.parse(this.now())); }
  label(s) { return STATUS[s]?.label || s; }
  checkTitle(t) {
    t = String(t ?? "").trim();
    if (!t) this.fail("相談内容（ひとことで）を入力してください");
    if (len(t) > 40) this.fail("相談内容（ひとことで）は40文字以内で入力してください");
    return t;
  }
  integrity() {
    const net = {}, bal = {};
    for (const l of this.db.ledger) {
      bal[l.student_id] = (bal[l.student_id] || 0) + l.delta;
      if (l.booking_id && (l.kind === "consume" || l.kind === "restore")) net[l.booking_id] = (net[l.booking_id] || 0) - l.delta;
    }
    if (Object.values(net).some((n) => n !== 0 && n !== 1)) this.fail("チケット消費の整合性エラー：同じ予約で2枚以上は消費できません");
    if (Object.values(bal).some((v) => v < 0)) this.fail("チケット残数がマイナスになる操作はできません");
    for (const b of this.db.bookings) {
      if ((b.status === "completed") !== b.ticket_consumed || (net[b.id] || 0) !== (b.ticket_consumed ? 1 : 0)) this.fail("整合性エラー：完了と消費の記録が一致しません");
    }
  }
  /* 1つの操作を「全部成功」か「何も変えない」で実行（データベースのトランザクション相当） */
  call(name, params) {
    if (!RPCS.includes(name)) this.fail("不明な操作です");
    const snap = JSON.stringify(this.db);
    try {
      const r = this[name](params || {});
      this.integrity();
      this.save();
      return r === undefined ? null : clone(r);
    } catch (e) { this.db = JSON.parse(snap); throw e; }
  }

  /* ----- 操作（schema.sql の関数と同じ名前・同じ規則）----- */
  request_booking(p) {
    const uid = this.uid(), admin = this.isAdmin();
    if (!p.p_request_id) this.fail("操作IDがありません");
    const ex = this.db.bookings.find((b) => b.request_id === p.p_request_id);
    if (ex) { if (ex.student_id !== uid && !admin) this.fail("権限がありません"); return ex; }
    const sid = admin && p.p_student_id ? p.p_student_id : uid;
    const sp = this.prof(sid);
    if (!sp || sp.role !== "student" || !sp.active) this.fail("受講生として登録されていません。管理者にお問い合わせください");
    const title = this.checkTitle(p.p_title);
    const tog = String(p.p_want_together ?? ""), lrn = String(p.p_want_learn ?? "");
    if (len(tog) > 2000 || len(lrn) > 2000) this.fail("文章は2000文字以内で入力してください");
    const slots = this.slots(p.p_slots);
    if (!slots || !slots.length) this.fail("希望日時を1つ以上入力してください");
    if (slots.length > 3) this.fail("希望日時は3つまでです");
    if (!admin && this.past(slots)) this.fail("過去の日時は選べません");
    const bal = this.balance(sid);
    const open = this.db.bookings.filter((b) => b.student_id === sid && (b.status === "requested" || b.status === "confirmed")).length;
    if (bal <= 0) this.fail("チケットの残りがありません（残り0枚）。管理者にお問い合わせください");
    if (!admin && open >= bal) this.fail(`申込中・確定の予約がすでに${open}件あり、残りチケット（${bal}枚）分に達しています`);
    const now = this.now();
    const b = { id: uuid(), booking_no: ++this.db.seq.booking, student_id: sid, title, want_together: tog, want_learn: lrn, preferred_slots: slots, scheduled_at: null, duration_min: 60, meeting_method: "lark_meeting", admin_message: "", status: "requested", status_before_cancel: null, ticket_consumed: false, completed_at: null, cancelled_at: null, request_id: p.p_request_id, version: 1, created_at: now, updated_at: now };
    this.db.bookings.push(b);
    this.log(uid, sid, b.id, "request", { title, slots });
    return b;
  }
  edit_booking(p) {
    const uid = this.uid(), admin = this.isAdmin();
    const b = this.bk(p.p_booking_id);
    if (!admin && b.student_id !== uid) this.fail("権限がありません");
    this.ver(b, p.p_expected_version);
    if (!admin && !["requested", "confirmed"].includes(b.status)) this.fail(`「${this.label(b.status)}」の予約は編集できません`);
    const title = this.checkTitle(p.p_title ?? b.title);
    const tog = p.p_want_together ?? b.want_together, lrn = p.p_want_learn ?? b.want_learn;
    if (len(tog) > 2000 || len(lrn) > 2000) this.fail("文章は2000文字以内で入力してください");
    const slots = p.p_slots ? this.slots(p.p_slots) : b.preferred_slots;
    if (!this.same(slots, b.preferred_slots)) {
      if (b.status !== "requested") this.fail("確定後の日時は「日時を変更」から変更してください");
      if (slots.length < 1 || slots.length > 3) this.fail("希望日時は1〜3つで入力してください");
      if (!admin && this.past(slots)) this.fail("過去の日時は選べません");
    }
    if (!admin && ((p.p_duration_min != null && Number(p.p_duration_min) !== b.duration_min) || (p.p_admin_message != null && p.p_admin_message !== b.admin_message) || (p.p_meeting_method != null && p.p_meeting_method !== b.meeting_method))) this.fail("時間・実施方法・連絡事項は管理者のみ変更できます");
    const dur = p.p_duration_min != null ? Number(p.p_duration_min) : b.duration_min;
    if (!(dur >= 15 && dur <= 240)) this.fail("時間は15〜240分で指定してください");
    const msg = p.p_admin_message ?? b.admin_message;
    if (len(msg) > 1000) this.fail("連絡事項は1000文字以内で入力してください");
    const method = p.p_meeting_method ?? b.meeting_method;
    if (!METHOD[method]) this.fail("実施方法は「Larkビデオ会議」か「Larkビデオ通話」を選んでください");
    const diff = {};
    if (title !== b.title) diff.title = [b.title, title];
    if (tog !== b.want_together) diff.want_together = [b.want_together, tog];
    if (lrn !== b.want_learn) diff.want_learn = [b.want_learn, lrn];
    if (!this.same(slots, b.preferred_slots)) diff.preferred_slots = [b.preferred_slots, slots];
    if (dur !== b.duration_min) diff.duration_min = [b.duration_min, dur];
    if (msg !== b.admin_message) diff.admin_message = [b.admin_message, msg];
    if (method !== b.meeting_method) diff.meeting_method = [b.meeting_method, method];
    if (!Object.keys(diff).length) return b;
    Object.assign(b, { title, want_together: tog, want_learn: lrn, preferred_slots: slots, duration_min: dur, admin_message: msg, meeting_method: method });
    this.touch(b);
    this.log(uid, b.student_id, b.id, "edit", diff);
    return b;
  }
  confirm_booking(p) {
    const uid = this.uid();
    if (!this.isAdmin()) this.fail("予約の確定は管理者のみ行えます");
    if (!p.p_scheduled_at) this.fail("確定する日時を選んでください");
    if (p.p_meeting_method != null && !METHOD[p.p_meeting_method]) this.fail("実施方法は「Larkビデオ会議」か「Larkビデオ通話」を選んでください");
    const at = new Date(p.p_scheduled_at).toISOString();
    const b = this.bk(p.p_booking_id);
    if (b.status === "confirmed" && Date.parse(b.scheduled_at) === Date.parse(at)) return b;
    this.ver(b, p.p_expected_version);
    if (b.status !== "requested") this.fail(`「申込中」の予約だけを確定できます（現在：${this.label(b.status)}）`);
    b.status = "confirmed"; b.scheduled_at = at;
    if (p.p_duration_min != null) b.duration_min = Number(p.p_duration_min);
    if (p.p_admin_message != null) b.admin_message = String(p.p_admin_message);

  }
  reschedule_booking(p) {
    const uid = this.uid();

    if (!p.p_new_at) this.fail("新しい日時を入力してください");

  request_change(p) {
    const uid = this.uid(), admin = this.isAdmin();

    const slots = this.slots(p.p_slots);
    if (b.status === "requested" && slots && this.same(b.preferred_slots, slots)) return b;
    this.ver(b, p.p_expected_version);
    if (b.status !== "confirmed") this.fail(`「確定」の予約だけ変更を依頼できます（現在：${this.label(b.status)}）`);
    if (!slots || slots.length < 1 || slots.length > 3) this.fail("希望日時は1〜3つで入力してください");

    Object.assign(b, { status: "requested", scheduled_at: null, preferred_slots: slots });

  complete_booking(p) {
    const uid = this.uid();

    if (!p.p_request_id) this.fail("操作IDがありません");
    const b = this.bk(p.p_booking_id);
    if (this.hasReq(p.p_request_id) || b.status === "completed") return { result: "already_done", remaining: this.balance(b.student_id) };
    if (b.status !== "confirmed") this.fail(`「確定」の予約だけを完了にできます（現在：${this.label(b.status)}）`);
    const bal = this.balance(b.student_id);
    if (bal < 1) this.fail("チケットの残りが0枚のため完了にできません。先にチケットを発行してください");
    const lid = this.addLedger({ student_id: b.student_id, kind: "consume", delta: -1, booking_id: b.id, reason: "個別コンサル完了", actor_id: uid, request_id: p.p_request_id });
    Object.assign(b, { status: "completed", ticket_consumed: true, completed_at: this.now() });
    this.touch(b);
    this.log(uid, b.student_id, b.id, "complete", { ledger_id: lid, remaining_before: bal, remaining_after: bal - 1 });

  undo_completion(p) {
    const uid = this.uid();
    if (!this.isAdmin()) this.fail("訂正は管理者のみ行えます");
    const reason = this.needReason(p.p_reason);
    if (!p.p_request_id) this.fail("操作IDがありません");
    const b = this.bk(p.p_booking_id);
    if (this.hasReq(p.p_request_id)) return { result: "already_done", remaining: this.balance(b.student_id) };
    if (b.status !== "completed") this.fail(`「完了」の予約ではありません（現在：${this.label(b.status)}）`);
    this.addLedger({ student_id: b.student_id, kind: "restore", delta: 1, booking_id: b.id, reason: "完了の取り消し：" + reason, actor_id: uid, request_id: p.p_request_id });
    Object.assign(b, { status: "confirmed", ticket_consumed: false, completed_at: null });
    this.touch(b);
    const bal = this.balance(b.student_id);
    this.log(uid, b.student_id, b.id, "undo_complete", { remaining_after: bal }, reason);
    return { result: "done", remaining: bal };
  }
  cancel_booking(p) {
    const uid = this.uid(), admin = this.isAdmin();
    const b = this.bk(p.p_booking_id);
    if (!admin && b.student_id !== uid) this.fail("権限がありません");
    if (b.status === "cancelled") return b;
    if (b.status === "completed") this.fail("完了済みの予約はキャンセルできません。誤って完了にした場合は、管理者が「完了の取り消し」を行います");
    Object.assign(b, { status_before_cancel: b.status, status: "cancelled", cancelled_at: this.now() });
    this.touch(b);
    this.log(uid, b.student_id, b.id, "cancel", { from: b.status_before_cancel }, p.p_reason);
    return b;
  }
  undo_cancellation(p) {
    const uid = this.uid();
    if (!this.isAdmin()) this.fail("訂正は管理者のみ行えます");
    const reason = this.needReason(p.p_reason);
    const b = this.bk(p.p_booking_id);
    if (b.status !== "cancelled") return b;
    const to = b.status_before_cancel === "confirmed" && b.scheduled_at ? "confirmed" : "requested";
    Object.assign(b, { status: to, status_before_cancel: null, cancelled_at: null });
    this.touch(b);
    this.log(uid, b.student_id, b.id, "undo_cancel", { to }, reason);
    return b;
  }
  issue_tickets(p) {
    const uid = this.uid();
    if (!this.isAdmin()) this.fail("チケットの発行は管理者のみ行えます");
    if (!p.p_request_id) this.fail("操作IDがありません");
    if (this.hasReq(p.p_request_id)) return { result: "already_done", remaining: this.balance(p.p_student_id) };
    const n = Number(p.p_count);
    if (!Number.isInteger(n) || n < 1 || n > 100) this.fail("発行枚数は1〜100枚で指定してください");
    const sp = this.prof(p.p_student_id);
    if (!sp || sp.role !== "student") this.fail("受講生が見つかりません");
    this.addLedger({ student_id: sp.id, kind: "issue", delta: n, reason: String(p.p_reason || "").trim() || "ほほえみプレミアム30枚チケット発行", actor_id: uid, request_id: p.p_request_id });
    const bal = this.balance(sp.id);
    this.log(uid, sp.id, null, "issue", { count: n, remaining_after: bal }, p.p_reason);
    return { result: "done", remaining: bal };

  adjust_tickets(p) {
    const uid = this.uid();
    if (!this.isAdmin()) this.fail("枚数の調整は管理者のみ行えます");
    const reason = this.needReason(p.p_reason);
    if (!p.p_request_id) this.fail("操作IDがありません");
    if (this.hasReq(p.p_request_id)) return { result: "already_done", remaining: this.balance(p.p_student_id) };
    const d = Number(p.p_delta);
    if (!Number.isInteger(d) || d === 0 || d < -100 || d > 100) this.fail("調整枚数は -100〜100（0以外）で指定してください");
    const bal = this.balance(p.p_student_id);
    if (bal + d < 0) this.fail(`調整後の残数がマイナスになります（現在 ${bal} 枚）`);
    this.addLedger({ student_id: p.p_student_id, kind: "adjust", delta: d, reason, actor_id: uid, request_id: p.p_request_id });
    this.log(uid, p.p_student_id, null, "adjust", { delta: d, remaining_after: bal + d }, reason);

    if (pr.role === "admin" && p.p_active === false) this.fail("管理者を利用停止にはできません");
    const name = [...String(p.p_display_name ?? pr.display_name).trim()].slice(0, 40).join("");

    if (p.p_active != null && p.p_active !== pr.active) diff.active = [pr.active, p.p_active];

  /* ----- 閲覧（schema.sql のビューと同じ形。受講生には本人の行だけ返す）----- */
  load() {
    const me = this.me, admin = this.isAdmin();
    const vis = (sid) => admin || sid === me.id;
    const P = Object.fromEntries(this.db.profiles.map((p) => [p.id, p]));
    const run = {};
    const ledgerAll = [...this.db.ledger]
      .sort((a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : a.id - b.id))
      .map((l) => { run[l.student_id] = (run[l.student_id] || 0) + l.delta; const { request_id, ...rest } = l; return { ...rest, balance_after: run[l.student_id], actor_name: P[l.actor_id]?.display_name ?? null, actor_role: P[l.actor_id]?.role ?? null }; });
    const balances = this.db.profiles.filter((p) => p.role === "student" && vis(p.id)).map((p) => {
      const ls = this.db.ledger.filter((l) => l.student_id === p.id);
      const sum = (f) => ls.filter(f).reduce((a, l) => a + l.delta, 0);
      return { student_id: p.id, display_name: p.display_name, ...(admin ? { email: p.email, key_issued_at: p.key_issued_at } : {}), active: p.active, issued: sum((l) => l.kind === "issue"), used: -sum((l) => l.kind === "consume" || l.kind === "restore"), adjusted: sum((l) => l.kind === "adjust"), remaining: sum(() => true) };
    });
    const bookings = this.db.bookings.filter((b) => vis(b.student_id)).map((b) => {
      let c = null;
      if (b.ticket_consumed) for (const l of ledgerAll) if (l.booking_id === b.id && l.kind === "consume" && (!c || l.id > c.id)) c = l;
      return { ...b, student_name: P[b.student_id]?.display_name ?? "", consumed_at: c?.created_at ?? null, remaining_after_use: c?.balance_after ?? null };
    });
    const events = this.db.events.filter((e) => admin || e.student_id === me.id)
      .map((e) => ({ ...e, actor_name: P[e.actor_id]?.display_name ?? null, student_name: P[e.student_id]?.display_name ?? null }))
      .sort((a, b) => b.id - a.id);
    // 本番と同じく、受講生にはメールアドレス・キーを渡さない。キーは管理者でも admin_get_key でのみ取得
    const publicProfile = ({ email, access_key, ...p }) => (admin ? { ...p, email } : p);
    const heartbeat = admin ? new Date(Date.now() - 5 * 3600e3).toISOString() : null;   // デモ用の見本（本番は毎朝の自動アクセスの日時）
    return clone({ me: publicProfile(me), profiles: this.db.profiles.filter((p) => admin || p.id === me.id || p.role === "admin").map(publicProfile), bookings, balances, ledger: ledgerAll.filter((l) => vis(l.student_id)), events, heartbeat });
  }

function friendly(err) {
  const m = String(err?.message || err || "");
  if (/permission denied|not authorized|JWT/i.test(m)) return api.mode === "student" ? "この操作はできません。画面を更新してから、もう一度お試しください" : "この操作の権限がありません。もう一度ログインしてお試しください";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "通信できませんでした。電波の良い場所で、もう一度お試しください";
  return m || "うまく処理できませんでした";
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("必要なファイルを読み込めませんでした")); document.head.appendChild(s); });
}
/* mode: "demo" | "student"（専用リンク） | "admin"（管理者ログイン） | "unconfigured"（準備中） */
const api = {
  mode: "demo", server: null, sb: null, key: null,
  async init() {
    if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY) {
      await loadScript(SUPABASE_JS);
      this.key = readKeyFromHash();
      if (this.key || hasHashKey()) {
        // 受講生：ログインの記録を一切使わない（同じ端末で管理者がログインしていても、受講生の画面として動く）
        this.mode = "student";
        this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      } else {
        this.mode = "admin";
        this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      }
    } else if (CONFIG.DEMO) {
      this.mode = "demo";
      this.server = new DemoServer();
    } else {
      this.mode = "unconfigured";
    }
  },
  async load() {
    if (this.mode === "demo") { await sleep(80); return this.server.load(); }
    if (this.mode === "student") {
      if (!this.key) throw new Error("このリンクは使えません。Larkのチャットで届いた最新のリンクから開いてください");
      const { data: d, error } = await this.sb.rpc("student_load", { p_key: this.key });
      if (error) throw new Error(friendly(error));
      const me = d.me;
      return { me, profiles: [me, ...(d.admins || [])], bookings: d.bookings || [], balances: d.balance ? [d.balance] : [], ledger: d.ledger || [], events: d.events || [] };
    }
    const { data: { user } } = await this.sb.auth.getUser();
    if (!user) return null;
    const q = async (pr) => { const { data, error } = await pr; if (error) throw new Error(friendly(error)); return data; };
    const profiles = await q(this.sb.from("profiles").select("id,auth_user_id,display_name,email,role,active,created_at"));
    const me = profiles.find((p) => p.auth_user_id === user.id && p.role === "admin");
    if (!me) { const e = new Error("このアカウントは管理者として登録されていません"); e.notAdmin = true; throw e; }
    const [bookings, balances, ledger, events, hb] = await Promise.all([
      q(this.sb.from("v_bookings").select("*").order("created_at", { ascending: false }).limit(1000)),
      q(this.sb.from("v_balances").select("*")),
      q(this.sb.from("v_ledger").select("*").order("id", { ascending: false }).limit(1000)),
      q(this.sb.from("v_events").select("*").order("id", { ascending: false }).limit(1000)),
      q(this.sb.from("heartbeat").select("last_ping")),
    ]);
    return { me, profiles, bookings, balances, ledger, events, heartbeat: hb?.[0]?.last_ping || null };
  },
  async call(fn, params) {
    if (this.mode === "demo") { await sleep(300); return this.server.call(fn, params); }
    const p = { ...params };
    if (STUDENT_FNS.includes(fn)) p.p_key = this.mode === "student" ? this.key : null;
    const { data, error } = await this.sb.rpc(fn, p);
    if (error) throw new Error(friendly(error));
    return data;
  },
};

function baseFiltered() {
  const f = state.f, q = f.q.trim().toLowerCase(), t0 = startOfTodayMs();
  return D().bookings.filter((b) => {
    if (f.student !== "all" && b.student_id !== f.student) return false;
    if (f.period === "upcoming" && Date.parse(keyDate(b)) < t0) return false;
    if (f.period === "past" && Date.parse(keyDate(b)) >= t0) return false;
    if (q) { const hay = [b.title, b.want_together, b.want_learn, b.student_name, b.admin_message, "#" + b.booking_no].join(" ").toLowerCase(); if (!q.split(/\s+/).every((w) => hay.includes(w))) return false; }
    return true;
  });
}
function sortBookings(list) {
  const rank = { requested: 0, confirmed: 1, completed: 2, cancelled: 3 };
  const s = state.f.sort;
  return list.sort((a, b) => {
    const da = Date.parse(keyDate(a)), db = Date.parse(keyDate(b));
    if (s === "new") return db - da;
    if (s === "old") return da - db;
    if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
    return rank[a.status] <= 1 ? da - db : db - da;
  });
}
function filtersHTML() {

/* ---------- 操作パネル ---------- */
function timeOptions(sel) {
  const vals = [];
  for (let m = 7 * 60; m <= 22 * 60; m += 30) vals.push(`${pad(Math.floor(m / 60))}:${pad(m % 60)}`);
  if (sel && !vals.includes(sel)) { vals.push(sel); vals.sort(); }
  return vals.map((v) => `<option value="${v}"${v === sel ? " selected" : ""}>${v}</option>`).join("");
}

    <input type="date" id="slot-date-${i + 1}" name="slot_date" aria-label="第${i + 1}希望の日付" value="${iso ? isoToJstDate(iso) : ""}"${min ? ` min="${min}"` : ""}${i === 0 ? " required" : ""}>
    <select id="slot-time-${i + 1}" name="slot_time" aria-label="第${i + 1}希望の時刻">${timeOptions(iso ? isoToJstTime(iso) : "10:00")}</select>
    <button type="button" class="icon-btn" data-act="remove-slot" aria-label="この候補を削除">×</button></div>`;
}
function slotsEditorHTML(slots, min, legend = "希望日時") {

    <div class="slot-list">${list.map((s, i) => slotRowHTML(i, s, min)).join("")}</div>

function relabelSlots(fs) {
  const rows = $$(".slot-row", fs);
  rows.forEach((r, i) => {
    $(".slot-label", r).textContent = `第${i + 1}希望`;
    const d = $("input[type=date]", r), t = $("select", r);
    d.id = `slot-date-${i + 1}`; d.setAttribute("aria-label", `第${i + 1}希望の日付`); d.required = i === 0;
    t.id = `slot-time-${i + 1}`; t.setAttribute("aria-label", `第${i + 1}希望の時刻`);

function readSlots(form) {
  const ds = $$("input[name=slot_date]", form).map((i) => i.value), ts = $$("select[name=slot_time]", form).map((s) => s.value), out = [];
  ds.forEach((d, i) => { if (d) { const iso = jstToISO(d, ts[i]); if (!out.some((x) => Date.parse(x) === Date.parse(iso))) out.push(iso); } });
  return out;
}

/* =====================================================================
   操作の処理（ボタン・フォーム）
   ===================================================================== */
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}
async function reload() {
  try { state.data = await api.load(); state.fatal = null; }
  catch (e) { state.data = null; state.fatal = friendly(e); }
  if (state.data && state.sheet?.type === "booking" && !bookingById(state.sheet.id)) state.sheet = null;
}
async function after(msg, sheet) {
  if (sheet !== undefined) state.sheet = sheet;
  else if (state.sheet) state.sheet = { ...state.sheet, panel: null, reqId: null };
  await reload(); render(); toast(msg);
}
function setBusy(form, v) {
  state.busy = v;
  form.setAttribute("aria-busy", String(v));
  $$("button", form).forEach((b) => {
    b.disabled = v;
    if (b.type === "submit") { if (v) { b.dataset.label = b.textContent; b.textContent = "処理中…"; } else if (b.dataset.label) b.textContent = b.dataset.label; }
  });
}
function showErr(form, msg) { const e = $(".form-error", form); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: "nearest" }); } }

const FORMS = {
  async "new-booking"(form, fd, s) {
    const slots = readSlots(form);
    if (!slots.length) throw new Error("希望日時を1つ以上入力してください");
    const p = { p_title: fd.get("title"), p_want_together: fd.get("want_together"), p_want_learn: fd.get("want_learn"), p_slots: slots, p_request_id: s.reqId, p_student_id: isAdmin() ? fd.get("student") || null : null };
    if (isAdmin() && !p.p_student_id) throw new Error("受講生を選んでください");
    const b = await api.call("request_booking", p);
    await after("お申込みを受け付けました。管理者の確定をお待ちください（チケットはまだ使っていません）", { type: "booking", id: b.id });
  },
  async edit(form, fd, s) {
    const b = bookingById(s.id), admin = isAdmin();
    const p = { p_booking_id: b.id, p_expected_version: b.version, p_title: fd.get("title"), p_want_together: fd.get("want_together"), p_want_learn: fd.get("want_learn"), p_slots: null, p_duration_min: null, p_admin_message: null };
    if (b.status === "requested") { p.p_slots = readSlots(form); if (!p.p_slots.length) throw new Error("希望日時を1つ以上入力してください"); }
    if (admin) { p.p_duration_min = Number(fd.get("duration")); p.p_admin_message = fd.get("admin_message"); p.p_meeting_method = fd.get("method"); }
    await api.call("edit_booking", p);
    await after("保存しました。変更内容は履歴に残ります");
  },
  async confirm(form, fd, s) {
    const b = bookingById(s.id), pick = fd.get("pick");
    let at;
    if (pick === "other") { if (!fd.get("other_date")) throw new Error("別の日時の日付を入力してください"); at = jstToISO(fd.get("other_date"), fd.get("other_time")); }
    else at = b.preferred_slots[Number(pick)];
    const method = fd.get("method") || "lark_meeting";
    await api.call("confirm_booking", { p_booking_id: b.id, p_expected_version: b.version, p_scheduled_at: at, p_duration_min: Number(fd.get("duration")), p_admin_message: fd.get("admin_message"), p_meeting_method: method });
    await after(`予約を確定しました（${fmtWhen(at)}・${methodLabel(method)}）`);
  },
  async reschedule(form, fd, s) {
    const b = bookingById(s.id), at = jstToISO(fd.get("new_date"), fd.get("new_time"));
    if (Date.parse(at) === Date.parse(b.scheduled_at)) throw new Error("いまと同じ日時です。新しい日時を選んでください");
    await api.call("reschedule_booking", { p_booking_id: b.id, p_expected_version: b.version, p_new_at: at, p_reason: fd.get("reason") });
    await after(`日時を変更しました（${fmtWhen(at)}）。変更の記録を残しました`);
  },
  async change(form, fd, s) {
    const b = bookingById(s.id), slots = readSlots(form);
    if (!slots.length) throw new Error("新しい希望日時を1つ以上入力してください");
    await api.call("request_change", { p_booking_id: b.id, p_expected_version: b.version, p_slots: slots, p_reason: fd.get("reason") });
    await after("日時の変更を依頼しました。管理者の確定をお待ちください");
  },
  async complete(form, fd, s) {
    const r = await api.call("complete_booking", { p_booking_id: s.id, p_request_id: s.reqId });
    await after(r?.result === "already_done" ? `すでに完了済みです（追加でチケットは使っていません。残り${r.remaining}枚）` : `完了にしました。チケットを1枚使いました（残り${r.remaining}枚）`);
  },
  async cancel(form, fd, s) {
    await api.call("cancel_booking", { p_booking_id: s.id, p_reason: fd.get("reason") || "" });
    await after("キャンセルしました（チケットは使っていません）");
  },
  async "undo-complete"(form, fd, s) {
    const r = await api.call("undo_completion", { p_booking_id: s.id, p_reason: fd.get("reason"), p_request_id: s.reqId });
    await after(`完了を取り消し、チケットを1枚戻しました（残り${r.remaining}枚）。訂正の記録を残しました`);
  },
  async "undo-cancel"(form, fd, s) {
    await api.call("undo_cancellation", { p_booking_id: s.id, p_reason: fd.get("reason") });
    await after("キャンセルを取り消しました。訂正の記録を残しました");
  },
  async issue(form, fd, s) {
    const r = await api.call("issue_tickets", { p_student_id: s.id, p_count: Number(fd.get("count")), p_reason: fd.get("note") || "", p_request_id: s.reqId });
    await after(r?.result === "already_done" ? "この発行はすでに記録されています" : `${fd.get("count")}枚発行しました（残り${r.remaining}枚）`);
  },
  async adjust(form, fd, s) {
    const d = Number(fd.get("delta"));
    if (!Number.isInteger(d) || d === 0) throw new Error("0以外の整数で入力してください（例：1、-1）");
    const r = await api.call("adjust_tickets", { p_student_id: s.id, p_delta: d, p_reason: fd.get("reason"), p_request_id: s.reqId });
    await after(`枚数を調整しました（残り${r.remaining}枚）。訂正の記録を残しました`);
  },
  async profile(form, fd, s) {
    await api.call("update_profile", { p_user_id: s.id, p_display_name: fd.get("name"), p_active: fd.get("active") === "on", p_email: String(fd.get("email") || "") });
    await after("保存しました");
  },
  async reissue(form, fd, s) {
    const k = await api.call("admin_reissue_key", { p_student_id: s.id, p_reason: fd.get("reason") || "" });
    await after("新しいリンクを発行しました。古いリンクは使えません。Larkのチャットで送り直してください", { ...s, panel: null, reqId: null, key: k, keyError: null });
  },
  async "add-student"(form, fd, s) {
    const p = await api.call("admin_create_student", { p_display_name: fd.get("name"), p_email: String(fd.get("email") || ""), p_request_id: s.reqId });
    await after(`${p.display_name} さんを登録しました。続けてチケットを発行してください`, { type: "student", id: p.id, panel: "issue", reqId: uuid(), key: p.access_key });
  },
  async "login-email"(form, fd) {
    const email = String(fd.get("email") || "").trim();
    const { error } = await api.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
    if (error) throw new Error(/not allowed|not found|Signups/i.test(error.message) ? "このメールアドレスは登録されていません。管理者にお問い合わせください" : /rate|limit/i.test(error.message) ? "送信の回数が多すぎます。しばらく時間をおいてお試しください" : friendly(error));
    state.login = { sent: true, email }; render();
  },
  async "login-code"(form, fd) {
    const { error } = await api.sb.auth.verifyOtp({ email: state.login.email, token: String(fd.get("code") || "").trim(), type: "email" });
    if (error) throw new Error("コードが正しくないか、有効期限が切れています。もう一度お試しください");
    state.mode = "app"; await reload(); render();
  },
};

document.addEventListener("submit", async (e) => {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  if (state.busy) return;                       // 二重送信を防ぐ（さらにサーバー側でも防止）
  const kind = form.dataset.form, fd = new FormData(form);
  const err = $(".form-error", form); if (err) err.hidden = true;
  setBusy(form, true);
  try { await FORMS[kind](form, fd, state.sheet || {}); }
  catch (ex) { showErr(form, friendly(ex)); }
  finally { setBusy(form, false); }
});

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (state.busy && act !== "close-sheet") return;
  switch (act) {
    case "tab": state.tab = el.dataset.tab; render(); break;
    case "open-booking": openSheet({ type: "booking", id, panel: null }); break;
    case "open-student": openSheet({ type: "student", id, panel: null, key: null }); loadStudentKey(id); break;
    case "new-booking": openSheet({ type: "new", student: el.dataset.student || null, reqId: uuid() }); break;
    case "add-student": openSheet({ type: "add-student", reqId: uuid() }); break;
    case "copy": {
      const t = document.getElementById(el.dataset.target);
      if (!t || !t.value) break;
      const what = el.dataset.target === "link-url" ? "リンク" : "案内文";
      const done = () => toast(`${what}をコピーしました。Larkのチャットに貼り付けてください`);
      const fallback = () => {
        const d = t.closest("details"); if (d) d.open = true;
        t.focus(); t.select();
        try { if (document.execCommand("copy")) { done(); return; } } catch (err) { /* 次の案内へ */ }
        toast(`${what}を選択しました。長押し（パソコンは右クリック）でコピーしてください`);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, fallback);
      else fallback();
      break;
    }
    case "close-sheet": if (!state.busy) { state.sheet = null; renderSheet(); } break;
    case "panel": state.sheet = { ...state.sheet, panel: el.dataset.panel, reqId: uuid() }; renderSheet(); $(".sheet").scrollTop = 0; break;
    case "panel-back": state.sheet = { ...state.sheet, panel: null, reqId: null }; renderSheet(); break;
    case "student-bookings": state.f = { q: "", status: "all", student: id, period: "all", sort: "attention" }; state.tab = "bookings"; state.sheet = null; render(); break;
    case "fstatus": state.f.status = el.dataset.v; render(); break;
    case "clear-filters": state.f = { q: "", status: "all", student: "all", period: "all", sort: "attention" }; render(); break;
    case "quick": {
      const q = el.dataset.q; state.tab = "bookings";
      state.f = { q: "", student: "all", sort: "attention", status: q === "pending" ? "requested" : q === "upcoming" ? "confirmed" : "completed", period: q === "upcoming" ? "upcoming" : "all" };
      render(); break;
    }
    case "add-slot": { const fs = el.closest("[data-slots]"), list = $(".slot-list", fs), n = $$(".slot-row", list).length; if (n < 3) { list.insertAdjacentHTML("beforeend", slotRowHTML(n, null, fs.dataset.min)); relabelSlots(fs); $$(".slot-row input[type=date]", list)[n].focus(); } break; }
    case "remove-slot": { const fs = el.closest("[data-slots]"), rows = $$(".slot-row", fs); if (rows.length > 1) { el.closest(".slot-row").remove(); relabelSlots(fs); } else { $("input[type=date]", rows[0]).value = ""; } break; }
    case "demo-reset":
      if (!state.resetArmed) { state.resetArmed = true; render(); setTimeout(() => { if (state.resetArmed) { state.resetArmed = false; render(); } }, 5000); }
      else { state.resetArmed = false; api.server.reset(); state.sheet = null; state.tab = "bookings"; await reload(); render(); toast("見本データに戻しました"); }
      break;
    case "reload": state.fatal = null; await reload(); render(); toast("最新の情報にしました"); break;
    case "logout": await api.sb.auth.signOut(); state.data = null; state.fatal = null; state.mode = "login"; state.login = { sent: false, email: "" }; render(); break;
    case "login-again": state.login = { sent: false, email: state.login.email }; render(); break;
  }
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset.input === "fq") { state.f.q = el.value; const l = $("#list"); if (l) l.innerHTML = listHTML(); updateChipCounts(); }
  if (el.dataset.input === "aq") { state.af.q = el.value; const l = $("#audit-list"); if (l) l.innerHTML = auditListHTML(); }
  if (el.dataset.count) { const c = document.getElementById(el.dataset.count); if (c) c.textContent = `${len(el.value)} / ${el.maxLength}`; }
});
function updateChipCounts() {
  const base = baseFiltered();
  $$("[data-act=fstatus]").forEach((b) => { const s = b.dataset.v; const c = $(".c", b); if (c) c.textContent = base.filter((x) => s === "all" || x.status === s).length; });
}
document.addEventListener("change", async (e) => {
  const el = e.target, k = el.dataset.change;
  if (!k) return;
  if (k === "demo-user") { api.server.setMe(el.value); state.sheet = null; state.tab = "bookings"; state.f = { q: "", status: "all", student: "all", period: "all", sort: "attention" }; await reload(); render(); toast(`${nameOf(el.value)} さんの画面に切り替えました`); return; }
  if (k === "fstudent") state.f.student = el.value;
  if (k === "fperiod") state.f.period = el.value;
  if (k === "fsort") state.f.sort = el.value;
  if (k === "astudent") state.af.student = el.value;
  if (k === "aaction") state.af.action = el.value;
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.sheet && !state.busy) { state.sheet = null; renderSheet(); } });

/* ---------- 起動 ---------- */
(async function boot() {
  try { await api.init(); }
  catch (e) { state.fatal = friendly(e); render(); return; }
  if (api.mode === "unconfigured") { render(); return; }
  if (api.mode === "student" || api.mode === "admin") {
    // 別の専用リンクを貼り付けて開き直したときなど、URLの#以降が変わったら読み込み直す
    window.addEventListener("hashchange", () => { if (!/access_token|error/.test(location.hash)) location.reload(); });
  }
  if (api.mode === "admin") {
    const { data: { session } } = await api.sb.auth.getSession();
    api.sb.auth.onAuthStateChange((ev) => {
      if (ev === "SIGNED_OUT") { state.data = null; state.fatal = null; state.mode = "login"; render(); }
      if (ev === "SIGNED_IN" && state.mode === "login") { state.mode = "app"; reload().then(render); }
    });
    if (!session) { state.mode = "login"; render(); return; }
  }
  state.mode = "app";
  await reload(); render();
})();
</script>
</body>
</html>
